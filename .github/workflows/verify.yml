name: verify

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: containerized verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Exactly the command the README documents for local use. CI has no separate pipeline.
      - name: Run the verification gate
        run: docker compose run --rm verify
